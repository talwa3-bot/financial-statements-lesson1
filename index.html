<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משחקי לימוד</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="assets/logo.png">
</head>
<body>
  <header class="site-header">
    <img src="assets/logo.png" alt="לוגו" class="logo"
      onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex';">
    <strong id="logo-fallback" class="logo-fallback" style="display:none;">משחקי לימוד</strong>
  </header>

  <main class="home-main">
    <h1>משחקי לימוד</h1>
    <p class="subtitle">שיעור 1: המאזן. בחרו משחק והתחילו ללמוד</p>

    <section class="nickname-section">
      <label for="nickname">איך קוראים לך?</label>
      <input id="nickname" type="text" placeholder="הקלידו כינוי" maxlength="20" autocomplete="off">
    </section>

    <section class="score-bar">
      <span class="score-label">ניקוד מצטבר</span>
      <span class="score-value" id="total-score">0</span>
    </section>

    <section class="games-grid">
      <button class="game-card pressable" data-game="maazan" type="button">
        <h3>משחק 1: שבץ את המאזן</h3>
        <p>מאזן - סיווג סעיפי מאזן, כולל מבחן מסכם</p>
        <span class="badge">שחקו עכשיו</span>
      </button>

      <button class="game-card pressable" data-game="hachlata" type="button">
        <h3>משחק 2: החלטה נכונה?</h3>
        <p>מאזן - החלטות מהחיים של עסק קטן: כן, לא או תלוי? עם עזרה מה-AI</p>
        <span class="badge">שחקו עכשיו</span>
      </button>
    </section>
  </main>

  <script>
    (function () {
      var NICKNAME_KEY = "learnGames_nickname";
      var TOTAL_SCORE_KEY = "learnGames_totalScore";

      var nicknameInput = document.getElementById("nickname");
      try {
        var savedNickname = localStorage.getItem(NICKNAME_KEY);
        if (savedNickname) {
          nicknameInput.value = savedNickname;
        }
      } catch (e) {
        // localStorage לא זמין; מתעלמים בשקט
      }

      nicknameInput.addEventListener("input", function () {
        try {
          localStorage.setItem(NICKNAME_KEY, nicknameInput.value);
        } catch (e) {
          // localStorage לא זמין; מתעלמים בשקט
        }
      });

      var totalScoreEl = document.getElementById("total-score");
      try {
        var total = parseInt(localStorage.getItem(TOTAL_SCORE_KEY) || "0", 10);
        totalScoreEl.textContent = isNaN(total) ? "0" : String(total);
      } catch (e) {
        totalScoreEl.textContent = "0";
      }

      document.querySelector('[data-game="maazan"]').addEventListener("click", function () {
        window.location.href = "games/02-maazan.html";
      });

      document.querySelector('[data-game="hachlata"]').addEventListener("click", function () {
        window.location.href = "games/04-hachlata.html";
      });

    })();
  </script>
</body>
</html>
